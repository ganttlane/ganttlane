name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its previous run; every commit on main gets its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (the tag is in the comment); Dependabot
# keeps both up to date (.github/dependabot.yml).

jobs:
  check:
    name: check (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The LTS lines allowed by `engines.node`; 24 matches .nvmrc / .tool-versions.
        node-version: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from `packageManager` in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (format, lint, dependency rules, types, tests with coverage, build, packed files, size)
        run: pnpm check

      - name: Upload coverage report
        if: ${{ !cancelled() && matrix.node-version == 24 }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # The browser suite (`pnpm test:e2e`, playwright.config.ts) is a job of its own, one per engine:
  # a red check names the engine that failed, the engines run side by side, and `check` above stays
  # about code quality. Each job builds the playground and runs the whole suite in its engine.
  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Browser builds are tied to the Playwright version, so it is part of the cache key; each
      # engine has a cache of its own, so a job restores only the browser it runs.
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{ print $2 }')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}

      - name: Install ${{ matrix.browser }} and its system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      # Cached browsers still need their OS packages on a fresh runner.
      - name: Install system dependencies of ${{ matrix.browser }}
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps ${{ matrix.browser }}

      # Builds the playground and serves it with `vite preview` (see playwright.config.ts).
      - name: Run e2e tests in ${{ matrix.browser }}
        run: pnpm test:e2e --project=${{ matrix.browser }}

      # The HTML report has the traces of the tests that were retried; `test-results` the screenshots.
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
