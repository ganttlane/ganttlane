name: Pages

# Builds the documentation site (apps/site: Astro Starlight, with the live examples of examples/)
# and deploys it to GitHub Pages at https://ganttlane.github.io/ganttlane/.
#
# Before the first deploy, once: in the repository, Settings > Pages > Build and deployment >
# Source: "GitHub Actions". (The `github-pages` environment is created by the first run; add its
# deployment branch rule, `main`, there if you want one.) Until then the `deploy` job fails and
# nothing is published; the `build` job still shows whether the site builds.

on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'examples/**'
      - 'packages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A deploy that is running is not cancelled: the next one waits for it.
concurrency:
  group: pages
  cancel-in-progress: false

# Third-party actions are pinned to full commit SHAs (the tag is in the comment); Dependabot
# keeps both up to date (.github/dependabot.yml).

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from `packageManager` in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The packages are read from source (the `@ganttlane/source` export condition), so no
      # package build comes first.
      - name: Build the site
        run: pnpm site:build

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # deploy to Pages
      id-token: write # prove to Pages that the deploy comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
