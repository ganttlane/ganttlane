name: Release

# Changesets release flow (docs: https://changesets.dev/guide/automating):
#   pending changesets on main  -> `version` job opens / updates the "Version Packages" PR;
#   that PR merged (no changesets, versions not on npm yet) -> `pack` builds and checks the
#   packages and packs the tarballs -> `publish` uploads them to npm with provenance, pushes git
#   tags and creates GitHub releases.
# `id-token: write` (npm trusted publishing + provenance) is granted to the `publish` job only,
# which builds nothing: it uploads the tarballs produced by `pack`.
#
# Runs on every push to main and by hand, but does nothing unless the repository variable
# RELEASE_ENABLED is 'true'. The repository is github.com/ganttlane/ganttlane (public: npm provenance
# requires it) and the packages are published under the `@ganttlane` npm scope. Before the first
# release (0.1.0, `.changeset/first-release.md`), once:
#   1. npm: create the `ganttlane` organization (owner of the `@ganttlane` scope) and, optionally,
#      reserve the unscoped `ganttlane` name.
#   2. GitHub: create ganttlane/ganttlane and push main. Settings > Actions > General: allow GitHub
#      Actions to create and approve pull requests. Create the `npm` environment (required
#      reviewers, deployments from `main` only).
#   3. npm: a trusted publisher can only be added to an existing package, so publish the three
#      packages once by hand (0.0.0 placeholders, see "First publish" in .changeset/README.md). Then,
#      per package, add a trusted publisher: GitHub Actions, ganttlane/ganttlane, workflow
#      `release.yml`, environment `npm`, allow `npm publish`. npm expires a trusted publisher that
#      sees no publish within 2 days of being added, so do this right before the first release.
#   4. Set RELEASE_ENABLED=true. The next push to main opens the "Version Packages" pull request
#      (0.0.0 -> 0.1.0); merging it publishes 0.1.0.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

# Never cancel a release half-way; queue the next run instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-mode:
    if: vars.RELEASE_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # no dependency cache in release jobs (cache poisoning)

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit the version bump to the release branch
      pull-requests: write # open / update the "Version Packages" PR
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A PR opened with GITHUB_TOKEN does not trigger the CI workflow; pass a GitHub App token
      # via `github-token` if branch protection requires CI on the Version Packages PR.
      - name: Version packages
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm version-packages
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'

  pack:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The full gate, so a release never ships a commit that fails CI; it also builds `dist`.
      - name: Check and build
        run: pnpm check

      # `pnpm pack` per package: runs the prepack/postpack hooks (LICENSE + NOTICE, exports
      # check) and applies `publishConfig` (exports without the `@ganttlane/source` condition).
      - name: Pack packages
        id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Must match the environment configured in the npm trusted publishers.
    environment: npm
    permissions:
      contents: write # push git tags and create GitHub releases
      id-token: write # npm trusted publishing (OIDC) and provenance
    env:
      # pnpm >= 11 publishes natively and reads PNPM_CONFIG_*, not NPM_CONFIG_PROVENANCE.
      # Explicit `true` makes a publish without provenance (e.g. from a private repo) fail.
      PNPM_CONFIG_PROVENANCE: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # Only @changesets/cli is needed here; no dependency scripts run next to the OIDC token.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Publish packages
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
